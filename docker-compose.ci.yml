# Infraestructura de CI. Va SEPARADA del compose de la aplicación a propósito:
# el pipeline hace "docker compose down -v" de la app y no debe apagar Jenkins.
# Uso:  docker compose -f docker-compose.ci.yml --env-file .env.infra up -d --build
name: reto7-ci

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    user: root                      # soluciona permisos del socket (entorno académico)
    restart: unless-stopped
    ports:
      - "9090:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP="
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
      SONAR_TOKEN: ${SONAR_TOKEN:-pendiente}
      REPO_URL: ${REPO_URL:?defina REPO_URL en .env.infra}
      REPO_BRANCH: ${REPO_BRANCH:-main}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_data:/var/jenkins_home          # incluye caché de ~/.m2, ~/.npm y pip
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
    networks:
      - ci-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Sin esto SonarQube rechaza el webhook hacia http://jenkins:8080 (IP privada)
      SONAR_VALIDATEWEBHOOKS: "false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      - sonar-db
    networks:
      - ci-network

  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - ci-network

  registry:
    image: registry:2
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "5000:5000"      # En macOS el puerto 5000 lo usa AirPlay: cambie a 5001:5000 y el Jenkinsfile
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - ci-network

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_db_data:
  registry_data:

networks:
  ci-network:
    name: ci-network
