jenkins:
  systemMessage: "Jenkins CI - Reto 7 (configurado con JCasC)"
  # 1 executor: los dos pipelines ejecutan E2E con el mismo compose/puertos, deben ir en serie
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin123}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "Token de SonarQube"
              secret: "${SONAR_TOKEN:-pendiente}"

unclassified:
  location:
    url: "http://localhost:9090/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

jobs:
  - script: |
      pipelineJob('gestion-empleados') {
        description('Java / Maven - build, test, Sonar, Docker, E2E')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branches('*/${REPO_BRANCH:-main}')
              }
            }
            scriptPath('microservicios/gestion-empleados/Jenkinsfile')
          }
        }
      }
  - script: |
      pipelineJob('gestion-departamentos') {
        description('Python / pytest - build, test, Sonar, Docker, E2E')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${REPO_URL}') }
                branches('*/${REPO_BRANCH:-main}')
              }
            }
            scriptPath('microservicios/gestion-departamentos/Jenkinsfile')
          }
        }
      }
