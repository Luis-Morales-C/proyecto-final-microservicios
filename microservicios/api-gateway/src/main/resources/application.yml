server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Timeouts del cliente HTTP que usa el gateway para hablar con los microservicios.
      # Si el destino no responde en este tiempo, se dispara un error que captura
      # GatewayErrorHandler y se convierte en un 503 con cuerpo JSON.
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

      routes:
        - id: empleados-service
          uri: ${EMPLEADOS_URL:http://empleados-service:8081}
          predicates:
            - Path=/empleados/**

        - id: departamentos-service
          uri: ${DEPARTAMENTOS_URL:http://departamentos-service:8082}
          predicates:
            - Path=/departamentos/**

        - id: notificaciones-service
          uri: ${NOTIFICACIONES_URL:http://notificaciones-service:8083}
          predicates:
            - Path=/notificaciones,/notificaciones/**

        - id: perfiles-service
          uri: ${PERFILES_URL:http://perfiles-service:8084}
          predicates:
            - Path=/perfiles,/perfiles/**

        - id: vacaciones-service
          uri: ${VACACIONES_URL:http://vacaciones-service:8085}
          predicates:
            - Path=/vacaciones,/vacaciones/**

        - id: auth-service
          uri: ${AUTH_URL:http://auth-service:8086}
          predicates:
            - Path=/auth/**

      # No se agregan filtros de StripPrefix: las rutas internas de los servicios
      # ya usan sus prefijos, así que el gateway reenvía el path tal cual llega.

management:
  endpoints:
    web:
      base-path: "/"
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:auth-service}