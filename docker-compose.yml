services:

  database-empleados:
    image: postgres:18
    container_name: database-empleados
    environment:
      POSTGRES_DB: ${EMPLEADOS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${EMPLEADOS_DB_PORT}:5432"
    volumes:
      - empleados-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${EMPLEADOS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network


  gestion-empleados:
    build:
      context: ./microservicios/gestion-empleados
    container_name: gestion-empleados
    expose:
      - "8081"
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${EMPLEADOS_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEPARTAMENTOS_URL: ${DEPARTAMENTOS_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      database-empleados:
        condition: service_healthy
      gestion-departamentos:
        condition: service_healthy
    networks:
      - microservices-network


  database-departamentos:
    image: postgres:18
    container_name: database-departamentos
    environment:
      POSTGRES_DB: ${DEPARTAMENTOS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DEPARTAMENTOS_DB_PORT}:5432"
    volumes:
      - departamentos-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DEPARTAMENTOS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network


  gestion-departamentos:
    build:
      context: ./microservicios/gestion-departamentos
    container_name: gestion-departamentos
    expose:
      - "8082"
    environment:
      DB_HOST: database-departamentos
      DB_PORT: 5432
      DB_NAME: ${DEPARTAMENTOS_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/departamentos')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      database-departamentos:
        condition: service_healthy
    networks:
      - microservices-network


  database-notificaciones:
    container_name: database-notificaciones
    image: postgres:18
    environment:
      POSTGRES_DB: notificaciones
      POSTGRES_USER: notificaciones
      POSTGRES_PASSWORD: notificaciones
    volumes:
      - notificaciones-db-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificaciones -d notificaciones"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network

  notificaciones-service:
    container_name: notificaciones-service
    restart: unless-stopped
    build:
      context: ./microservicios/notificaciones-service
    environment:
      PORT: 8083

      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: notificaciones
      DB_USER: notificaciones
      DB_PASSWORD: notificaciones

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "8083"
    depends_on:
      database-notificaciones:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    entrypoint: ["/bin/sh", "/etc/rabbitmq/init.sh"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/init.sh:/etc/rabbitmq/init.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  api-gateway:
    build:
      context: microservicios/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"          # único puerto publicado al host de todo el ecosistema
    environment:
      EMPLEADOS_URL: ${EMPLEADOS_URL}
      DEPARTAMENTOS_URL: ${DEPARTAMENTOS_URL}
      NOTIFICACIONES_URL: http://notificaciones-service:8083
    depends_on:
      gestion-empleados:
        condition: service_started    # gestion-empleados no tiene healthcheck (aún)
      gestion-departamentos:
        condition: service_healthy
      notificaciones-service:
        condition: service_started
    networks:
      - microservices-network

volumes:
  empleados-db-data:
  departamentos-db-data:
  rabbitmq-data:
  notificaciones-db-data:


networks:
  microservices-network: