services:

  database-empleados:
    image: postgres:18
    container_name: database-empleados
    environment:
      POSTGRES_DB: gestion_empleados
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - empleados-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_empleados"]
      interval: 5s
      timeout: 5s
      retries: 10

  gestion-empleados:
    build:
      context: ./microservicios/gestion-empleados
    container_name: gestion-empleados
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: gestion_empleados
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      database-empleados:
        condition: service_healthy

volumes:
  empleados-db-data: