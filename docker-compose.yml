services:

  database-empleados:
    image: postgres:18
    container_name: database-empleados
    environment:
      POSTGRES_DB: ${EMPLEADOS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - empleados-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${EMPLEADOS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  database-departamentos:
    image: postgres:18
    container_name: database-departamentos
    environment:
      POSTGRES_DB: ${DEPARTAMENTOS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - departamentos-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DEPARTAMENTOS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  database-notificaciones:
    image: postgres:18
    container_name: database-notificaciones
    environment:
      POSTGRES_DB: ${NOTIFICACIONES_DB:-notificaciones}
      POSTGRES_USER: ${NOTIFICACIONES_DB_USER:-notificaciones}
      POSTGRES_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones}
    expose:
      - "5432"
    volumes:
      - notificaciones-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICACIONES_DB_USER:-notificaciones} -d ${NOTIFICACIONES_DB:-notificaciones}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  database-perfiles:
    image: postgres:18
    container_name: database-perfiles
    environment:
      POSTGRES_DB: ${PERFILES_DB:-perfiles}
      POSTGRES_USER: ${PERFILES_DB_USER:-perfiles}
      POSTGRES_PASSWORD: ${PERFILES_DB_PASSWORD:-perfiles}
    expose:
      - "5432"
    volumes:
      - perfiles-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERFILES_DB_USER:-perfiles} -d ${PERFILES_DB:-perfiles}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  database-vacaciones:
    image: postgres:18
    container_name: database-vacaciones
    environment:
      POSTGRES_DB: ${VACACIONES_DB:-vacaciones}
      POSTGRES_USER: ${VACACIONES_DB_USER:-vacaciones}
      POSTGRES_PASSWORD: ${VACACIONES_DB_PASSWORD:-vacaciones}
    expose:
      - "5432"
    volumes:
      - vacaciones-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VACACIONES_DB_USER:-vacaciones} -d ${VACACIONES_DB:-vacaciones}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  # ---- NUEVO (Reto 5) ----
  database-auth:
    image: postgres:18
    container_name: database-auth
    environment:
      POSTGRES_DB: ${AUTH_DB:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    expose:
      - "5432"
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB:-auth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - microservices-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-network

  rabbitmq-init:
    image: curlimages/curl:8.16.0
    container_name: rabbitmq-init
    environment:
      DEFINITIONS_VERSION: "reto5"   # cambiado: fuerza a re-importar definitions.json
    entrypoint: ["curl"]
    command:
      - "--fail"
      - "--silent"
      - "--show-error"
      - "--user"
      - "${RABBITMQ_USER}:${RABBITMQ_PASSWORD}"
      - "--header"
      - "Content-Type: application/json"
      - "--request"
      - "POST"
      - "--data-binary"
      - "@/definitions.json"
      - "http://rabbitmq:15672/api/definitions"
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-network
    restart: "no"

  gestion-departamentos:
    build:
      context: ./microservicios/gestion-departamentos
    container_name: gestion-departamentos
    expose:
      - "8082"
    environment:
      DB_HOST: database-departamentos
      DB_PORT: 5432
      DB_NAME: ${DEPARTAMENTOS_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/departamentos')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      database-departamentos:
        condition: service_healthy
    networks:
      - microservices-network

  gestion-empleados:
    build:
      context: ./microservicios/gestion-empleados
    container_name: gestion-empleados
    expose:
      - "8081"
    environment:
      DB_HOST: database-empleados
      DB_PORT: 5432
      DB_NAME: ${EMPLEADOS_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEPARTAMENTOS_URL: ${DEPARTAMENTOS_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      database-empleados:
        condition: service_healthy
      gestion-departamentos:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - microservices-network

  # ---- NUEVO (Reto 5) ----
  auth-service:
    build:
      context: ./microservicios/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 8086
      DB_HOST: database-auth
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB:-auth}
      DB_USER: ${AUTH_DB_USER:-auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en el .env}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ACTIVATION_TOKEN_MINUTES: ${ACTIVATION_TOKEN_MINUTES:-60}
      RECOVERY_TOKEN_MINUTES: ${RECOVERY_TOKEN_MINUTES:-15}
      ADMIN_EMPLEADO_ID: ${ADMIN_EMPLEADO_ID:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    expose:
      - "8086"
    # Solo para pruebas directas mientras el gateway no enruta /auth. Quitar después.
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      database-auth:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - microservices-network

  notificaciones-service:
    build:
      context: ./microservicios/notificaciones-service
    container_name: notificaciones-service
    restart: unless-stopped
    environment:
      PORT: 8083
      DB_HOST: database-notificaciones
      DB_PORT: 5432
      DB_NAME: ${NOTIFICACIONES_DB:-notificaciones}
      DB_USER: ${NOTIFICACIONES_DB_USER:-notificaciones}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_RESET_URL: ${APP_RESET_URL:-https://app.empresa.com/reset}
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      database-notificaciones:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - microservices-network

  perfiles-service:
    build:
      context: ./microservicios/perfiles-service
    container_name: perfiles-service
    restart: unless-stopped
    environment:
      PORT: 8084
      DB_HOST: database-perfiles
      DB_PORT: 5432
      DB_NAME: ${PERFILES_DB:-perfiles}
      DB_USER: ${PERFILES_DB_USER:-perfiles}
      DB_PASSWORD: ${PERFILES_DB_PASSWORD:-perfiles}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: perfiles.empleados
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      database-perfiles:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - microservices-network

  vacaciones-service:
    build:
      context: ./microservicios/vacaciones-service
    container_name: vacaciones-service
    restart: unless-stopped
    environment:
      DB_HOST: database-vacaciones
      DB_PORT: 5432
      DB_NAME: ${VACACIONES_DB:-vacaciones}
      DB_USER: ${VACACIONES_DB_USER:-vacaciones}
      DB_PASSWORD: ${VACACIONES_DB_PASSWORD:-vacaciones}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      database-vacaciones:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ./microservicios/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EMPLEADOS_URL: ${EMPLEADOS_URL}
      DEPARTAMENTOS_URL: ${DEPARTAMENTOS_URL}
      NOTIFICACIONES_URL: http://notificaciones-service:8083
      PERFILES_URL: http://perfiles-service:8084
      VACACIONES_URL: http://vacaciones-service:8085
      # TODO (parte 2, compañero): AUTH_URL: http://auth-service:8086
      # TODO (parte 2, compañero): JWT_SECRET: ${JWT_SECRET}  y  JWT_ISSUER: ${JWT_ISSUER:-auth-service}
    depends_on:
      gestion-empleados:
        condition: service_started
      gestion-departamentos:
        condition: service_healthy
      notificaciones-service:
        condition: service_healthy
      perfiles-service:
        condition: service_healthy
      vacaciones-service:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  empleados-db-data:
  departamentos-db-data:
  notificaciones-db-data:
  perfiles-db-data:
  vacaciones-db-data:
  auth-db-data:
  rabbitmq-data:

networks:
  microservices-network: