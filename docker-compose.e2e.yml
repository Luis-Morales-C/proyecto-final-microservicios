# Docker Compose override para tests E2E
# Este archivo sobrescribe configuraciones específicas para el entorno de testing
# Uso: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up

services:
  # Eliminar container_name hardcodeados para permitir que el prefijo del proyecto funcione
  database-empleados:
    container_name: null
  
  database-departamentos:
    container_name: null
  
  database-notificaciones:
    container_name: null
  
  database-perfiles:
    container_name: null
  
  database-vacaciones:
    container_name: null
  
  database-auth:
    container_name: null
  
  gestion-empleados:
    container_name: null
  
  gestion-departamentos:
    container_name: null
  
  auth-service:
    container_name: null
  
  notificaciones-service:
    container_name: null
  
  perfiles-service:
    container_name: null
  
  vacaciones-service:
    container_name: null
  
  api-gateway:
    container_name: null
  
  rabbitmq-init:
    container_name: null

  rabbitmq:
    container_name: null
    # Override: usar Dockerfile custom que pregenera .erlang.cookie con permisos correctos
    # Esto resuelve el problema de 'eacces' en CI cuando Docker se ejecuta via socket mount
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile.e2e
    # Healthcheck ajustado para entornos CI con recursos limitados
    # Total timeout: start_period (90s) + (retries * interval) = 90s + (50 * 10s) = 590s (~10 min)
    # Pero típicamente estará healthy en 1-2 minutos en condiciones normales
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 50
      start_period: 90s

  # Deshabilitar promtail en E2E: el archivo de config no está disponible en el workspace de Jenkins
  # y no es crítico para los tests funcionales
  promtail:
    profiles:
      - observability-full

  # Deshabilitar otel-collector en E2E: mismo problema de archivo de config
  otel-collector:
    profiles:
      - observability-full

  # Deshabilitar prometheus en E2E: mismo problema de archivo de config
  prometheus:
    profiles:
      - observability-full

  # Deshabilitar grafana en E2E: depende de prometheus
  grafana:
    profiles:
      - observability-full

  # Deshabilitar loki en E2E: parte del stack de observabilidad
  loki:
    profiles:
      - observability-full

  # Ajustar healthcheck de notificaciones-service en E2E (más tiempo para arrancar en CI)
  notificaciones-service:
    container_name: null
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8083/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s